services:
  backend:
    build: ./backend-accessoires
    container_name: strapi-backend
    ports:
      - "1337:1337"
    environment:
      - HOST=0.0.0.0
      - PORT=1337
      - APP_KEYS=key1,key2,key3,key4
      - API_TOKEN_SALT=changeme_salt
      - ADMIN_JWT_SECRET=changeme_admin
      - TRANSFER_TOKEN_SALT=changeme_transfer
      - JWT_SECRET=changeme_jwt
    volumes:
      - strapi-db:/app/.tmp
      - strapi-uploads:/app/public/uploads
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend-vitrine
      args:
        NEXT_PUBLIC_API_URL: http://localhost:1337
    container_name: next-frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL_INTERNAL=http://backend:1337
      - NEXT_PUBLIC_API_URL=http://localhost:1337
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:

volumes:
  strapi-db:
  strapi-uploads:
